# Desktop builds (docs/desktop.md): macOS (universal .dmg) and Windows (.exe
# installer) via Tauri. Publishing a GitHub Release (Releases → Draft a new
# release, or `gh release create v0.2.0`) builds the installers and attaches
# them to that release; the app version comes from the release tag. A manual
# run uploads them as workflow artifacts instead.
#
# The builds ship code only. They never run `npm run fetch-cards`, and
# `vite build --mode desktop` drops any STCC data; the app downloads its own
# copy of the card database on first launch.

name: Desktop

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:all

  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            installer: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            asset: macOS.dmg
          - platform: windows-latest
            args: ''
            rust-targets: ''
            installer: src-tauri/target/release/bundle/nsis/*.exe
            asset: Windows-Setup.exe
    runs-on: ${{ matrix.platform }}
    env:
      # online play and invite links point at the hosted game (Settings →
      # Secrets and variables → Actions → Variables)
      VITE_PUBLIC_URL: ${{ vars.READY_ROOM_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      # Tauri reads the version from package.json; npm rejects a tag that is
      # not a version (v0.2.0 → 0.2.0)
      - name: Take the version from the release tag
        if: github.event_name == 'release'
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npx tauri build ${{ matrix.args }}

      - name: Check no card data was bundled
        shell: bash
        run: |
          if [ -e dist/stcc ]; then echo "dist/stcc must not exist in a desktop build"; exit 1; fi

      - name: Name the installer
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir out
          cp ${{ matrix.installer }} "out/Ready-Room-$version-${{ matrix.asset }}"
          ls -l out

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

      - name: Upload as workflow artifact (manual run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ready-room-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  notes:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Add install notes to the release
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
          case "$body" in *'<!-- install-notes -->'*) exit 0 ;; esac
          cat > notes.md <<'EOF'
          <!-- install-notes -->
          ## Install

          Download `Ready-Room-…-macOS.dmg` (Apple Silicon and Intel) or `Ready-Room-…-Windows-Setup.exe` below. On first launch the app downloads the STCC card database (about 340 MB) onto your computer; it is not part of this download.

          The builds are not code-signed. macOS: right-click the app → Open (or System Settings → Privacy & Security → Open Anyway). Windows: SmartScreen → More info → Run anyway.
          EOF
          if [ -n "$body" ]; then printf '%s\n\n' "$body" | cat - notes.md > release.md; else cp notes.md release.md; fi
          gh release edit "$GITHUB_REF_NAME" --notes-file release.md
